apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-example
  namespace: default
spec:
  action: delay
  mode: all
  selector:
    labelSelectors:
      "app": "stellar-nebula-nomad"
  delay:
    latency: '10ms'
    correlation: '100'
    jitter: '0ms'
  duration: '60s'
