codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "19...100"

  status:
    project:
      default:
        target: 19%
        threshold: 1%
        base: auto
    patch:
      default:
        target: 19%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/*"
  - "benches/*"
  - "examples/*"
