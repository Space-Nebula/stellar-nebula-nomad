# cargo-mutants configuration for stellar-nebula-nomad
# Configured for priority modules (Issue #478):
# - src/resource_minter.rs
# - src/nebula_gen.rs
# - src/ship_registry.rs
# - src/access_control.rs
# - src/nomad_bonding.rs

# Timeout multiplier to prevent false timeouts on complex Soroban VM tests
timeout_multiplier = 2.0

# Files to examine for mutation testing
examine_globs = [
    "src/resource_minter.rs",
    "src/nebula_gen.rs",
    "src/ship_registry.rs",
    "src/access_control.rs",
    "src/nomad_bonding.rs",
]

# Exclude trivial debug/display representations and non-logic logging
exclude_globs = [
    "src/error_standard.rs",
]

# Use Cargo's standard test runner. The current cargo-mutants releases do not
# support a `test_args` configuration key; test selection is controlled by the
# command-line invocation in scripts/mutation-test.sh.
test_tool = "cargo"
