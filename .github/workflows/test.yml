name: Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A push to main and the PR that produced it previously ran this whole matrix
# twice with no cancellation. Collapse them into one in-progress run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # This workflow's remaining job is deliberately narrow: cross-toolchain
  # compatibility. Formatting/clippy, coverage, fuzz, benchmarks and WASM
  # builds all run in ci.yml / fuzz.yml — duplicating them here was the single
  # largest source of redundant work across the pipeline.
  build:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
          # Per-toolchain key: stable and nightly artifacts must not be shared.
          cache-key: native-${{ matrix.rust }}

      # Keep a fast feedback smoke check that does not duplicate ci.yml's
      # `--all-features -D warnings` lint gate.
      - name: Check compilation
        run: cargo check --all-targets --locked

      - name: Run tests
        run: cargo test --all --locked
