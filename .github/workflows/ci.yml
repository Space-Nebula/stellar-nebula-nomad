name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded pipeline (e.g. a force-push or a push right after opening
# a PR) instead of running two full pipelines against the same work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Explicit sparse index: fast, deterministic dependency resolution regardless
  # of the runner's Cargo version.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Build (native + WASM) ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `cache-key: wasm` lets the deploy jobs reuse these compiled artifacts.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: wasm

      - name: Build (native)
        run: cargo build --verbose --locked

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-stellar-cli

      - name: Build (WASM release)
        # The release profile uses LTO + codegen-units=1, so incremental
        # compilation is deliberately disabled here.
        env:
          CARGO_INCREMENTAL: 0
        run: stellar contract build --verbose

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 7

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Incremental artifacts are cached with the shared key; native lint
      # builds benefit from them on warm-cache runs.
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # ─── Tests (no coverage instrumentation) ──────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native

      - name: Storage key collision check
        run: python3 scripts/check_storage_keys.py --strict

      - name: Run tests
        run: cargo test --all --locked

  # ─── Coverage (runs in PARALLEL with tests, not after them) ───────────────
  # Previously coverage was a second full test execution inside the `test`
  # job, so `cargo test` ran twice back-to-back and was the main timeout source.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache-key: native

      - name: Cache cargo-tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-cargo-tarpaulin-v1

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --locked

      # LLVM engine is substantially faster than the default ptrace engine on
      # the large test graph; Lcov is required by Codecov and Coveralls (the
      # old `--out Xml Html` never produced lcov.info).
      - name: Run tests with coverage
        run: |
          cargo tarpaulin \
            --all \
            --engine llvm \
            --timeout 120 \
            --out Xml Lcov Html \
            --output-dir coverage/

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml,coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          fail-on-error: false

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage/cobertura.xml', 'utf8');
            const match = xml.match(/line-rate="([\d.]+)"/);
            const pct = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';
            const emoji = parseFloat(pct) >= 19 ? '✅' : '⚠️';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Coverage Report\n\n**Line coverage:** ${pct}%\n\n> Enforced baseline: ≥ 19% (raise as tests are added). Download the full HTML report from the [Actions artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });

      - name: Enforce minimum coverage
        run: |
          XML=coverage/cobertura.xml
          RATE=$(grep -oP 'line-rate="\K[\d.]+' "$XML" | head -1)
          PCT=$(echo "$RATE * 100" | bc)
          echo "Coverage: ${PCT}%"
          # Current measured baseline is 19.7%; raise this as test coverage grows.
          MIN_COVERAGE=19
          if (( $(echo "$PCT < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage ${PCT}% is below the ${MIN_COVERAGE}% baseline."
            exit 1
          fi
          echo "✅ Coverage ${PCT}% meets the baseline."

  # ─── Contract size check ──────────────────────────────────────────────────
  size-check:
    name: Contract Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: wasm/

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Optimize WASM
        run: |
          for f in wasm/*.wasm; do
            stellar contract optimize --wasm "$f" --wasm-out "${f%.wasm}.optimized.wasm" 2>/dev/null \
              || cp "$f" "${f%.wasm}.optimized.wasm"
          done
      - uses: ./.github/actions/setup-stellar-cli

      - name: Optimize and check contract size (≤ 64 KB)
        run: |
          MAX_BYTES=65536
          FAILED=0
          for f in wasm/*.wasm; do
            stellar contract optimize --wasm "$f" --wasm-out "${f%.wasm}.optimized.wasm"
            SIZE=$(stat -c%s "${f%.wasm}.optimized.wasm")
            echo "$(basename $f): ${SIZE} bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "❌ $(basename $f) exceeds 64 KB limit (${SIZE} bytes)"
              FAILED=1
            else
              echo "✅ $(basename $f) within limit"
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

  # ─── Documentation ────────────────────────────────────────────────────────
  docs:
    name: Rustdoc (generate + check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native

      - name: Check for missing docs on public items
        env:
          RUSTDOCFLAGS: "-D missing_docs"
        run: cargo doc --all --no-deps --document-private-items=false --locked

      - name: Upload rustdoc artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: target/doc

  publish-docs:
    name: Publish Rustdocs to GitHub Pages
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Benchmarks ───────────────────────────────────────────────────────────
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native

      - name: Run benchmarks
        run: cargo bench --all --locked 2>&1 | tee benchmark-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output.txt
          retention-days: 7

  # ─── Testnet deploy (merge to main) ───────────────────────────────────────
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testnet
      url: https://stellar.expert/explorer/testnet
    steps:
      - uses: actions/checkout@v4

      # Reuse the exact WASM artifact produced by `build` instead of paying for
      # a fifth full WASM compile in this job.
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deploy-testnet-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          name: contract-wasm
          path: wasm/

      - uses: ./.github/actions/setup-stellar-cli

      - name: Deploy to Stellar testnet
        env:
          DEPLOYER_SECRET_KEY: ${{ secrets.DEPLOYER_SECRET_KEY }}
        run: |
          if [ -z "$DEPLOYER_SECRET_KEY" ]; then
            echo "DEPLOYER_SECRET_KEY is not configured; skipping live testnet deploy."
            echo "Set repo secret DEPLOYER_SECRET_KEY to enable automated testnet deployment."
            exit 0
          fi

          stellar network add \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015" \
            testnet || true

          echo "$DEPLOYER_SECRET_KEY" | stellar keys add deployer --secret-key

          WASM=$(ls target/wasm32v1-none/release/*.wasm | grep -v deps | head -1)
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM" \
          WASM=$(ls wasm/*.wasm | grep -v deps | head -1)
          if $CLI contract optimize --wasm "$WASM" --wasm-out optimized.wasm 2>/dev/null; then
            DEPLOY_WASM=optimized.wasm
          else
            DEPLOY_WASM="$WASM"
          fi

          CONTRACT_ID=$($CLI contract deploy \
            --wasm "$DEPLOY_WASM" \
            --source deployer \
            --network testnet)
          echo "Deployed to testnet: $CONTRACT_ID"
          echo "contract-id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          mkdir -p deployments
          printf '{"network":"testnet","contractId":"%s","commit":"%s","deployedAt":"%s"}\n' \
            "$CONTRACT_ID" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > deployments/testnet-latest.json

      - name: Upload testnet deployment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-testnet-${{ github.sha }}
          path: deployments/
          if-no-files-found: ignore
          retention-days: 90
