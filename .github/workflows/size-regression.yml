name: Contract Size Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # The committed baseline. It is READ via `git show` into a temp file during
  # comparison and is only written back at the very end, on main.
  WASM_BASELINE_FILE: .wasm-sizes.json
  CONFIG_FILE: .github/contract-size-config.json

jobs:
  size-regression:
    name: Contract Size Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to read the baseline from the comparison ref via `git show`.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-size-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-size-

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build WASM (release)
        run: stellar contract build

      - name: Optimize WASM
        run: |
          set -euo pipefail
          mkdir -p wasm
          for f in target/wasm32v1-none/release/*.wasm; do
            [ -e "$f" ] || continue
            out="wasm/$(basename "${f%.wasm}.optimized.wasm")"
            stellar contract optimize --wasm "$f" --wasm-out "$out" 2>/dev/null || cp "$f" "$out"
          done

      - name: Measure WASM sizes
        id: measure
        run: |
          set -euo pipefail
          SIZES=$(python3 - <<'PY'
          import glob, json, os
          sizes = {}
          for path in sorted(glob.glob("wasm/*.optimized.wasm")):
              sizes[os.path.basename(path)] = os.path.getsize(path)
          print(json.dumps(sizes, sort_keys=True))
          PY
          )
          echo "$SIZES" > "${RUNNER_TEMP}/current-sizes.json"
          echo "sizes=$SIZES" >> "$GITHUB_OUTPUT"
          echo "Current sizes: $SIZES"

      # Read the baseline from the comparison ref into a TEMP file. The
      # working-tree copy of .wasm-sizes.json is deliberately left untouched
      # so the PR report shows real "before" sizes.
      - name: Fetch baseline from comparison ref
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASELINE_TMP="${RUNNER_TEMP}/wasm-baseline.json"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare with the target branch (main for this workflow).
            CANDIDATES="origin/${BASE_REF:-main} origin/main"
          else
            # On a push to main, origin/main already points at this commit, so
            # use the parent commit's committed baseline instead.
            CANDIDATES="HEAD~1 origin/main"
          fi

          FOUND=0
          for REF in $CANDIDATES; do
            SOURCE="${REF}:${WASM_BASELINE_FILE}"
            if git cat-file -e "$SOURCE" 2>/dev/null; then
              git show "$SOURCE" > "$BASELINE_TMP"
              echo "Loaded baseline from ${SOURCE}."
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo '{}' > "$BASELINE_TMP"
            echo "No baseline found; treating this as the first measurement."
          fi

          echo "path=$BASELINE_TMP" >> "$GITHUB_OUTPUT"
          echo "Baseline contents:"
          cat "$BASELINE_TMP"

      # No --strict here: we capture outputs first, let history and the PR
      # comment run, and enforce the failure in a dedicated final step.
      - name: Compare against baseline
        id: compare
        env:
          SIZES: ${{ steps.measure.outputs.sizes }}
          BASELINE_PATH: ${{ steps.baseline.outputs.path }}
          CONFIG_PATH: ${{ env.CONFIG_FILE }}
        run: |
          python3 .github/scripts/contract_size.py compare \
            --current-env SIZES \
            --baseline "$BASELINE_PATH" \
            --config "$CONFIG_PATH"

      - name: Record size history
        env:
          SIZES: ${{ steps.measure.outputs.sizes }}
          CONFIG_PATH: ${{ env.CONFIG_FILE }}
        run: |
          python3 .github/scripts/contract_size.py history \
            --sizes-env SIZES \
            --config "$CONFIG_PATH"

      - name: Collect report artifacts
        env:
          BASELINE_PATH: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p size-report
          cp "$BASELINE_PATH" size-report/baseline-sizes.json
          cp "${RUNNER_TEMP}/current-sizes.json" size-report/current-sizes.json
          cp .wasm-size-history.json size-report/size-history.json

      - name: Upload optimized WASM
        uses: actions/upload-artifact@v4
        with:
          name: optimized-wasm-${{ github.sha }}
          path: wasm/*.optimized.wasm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload size report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-size-report-${{ github.sha }}
          path: size-report/*
          retention-days: 14
          if-no-files-found: warn

      - name: Post size report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.compare.outputs.report }}
          SUMMARY: ${{ steps.compare.outputs.summary }}
          FAILED: ${{ steps.compare.outputs.failed }}
        with:
          script: |
            const marker = '<!-- contract-size-report -->';
            const report = process.env.REPORT || '_No comparison report was produced._';
            const failed = process.env.FAILED === 'true';
            const footer = '<sub>' + (process.env.SUMMARY || '') +
              ' Limits are configured in `.github/contract-size-config.json`.</sub>';
            const body = [marker, report.trim(), '', '---', footer].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
            core.info(failed ? 'Posted regression report.' : 'Posted size report.');

      - name: Enforce size regression threshold
        if: steps.compare.outputs.failed == 'true'
        env:
          REPORT: ${{ steps.compare.outputs.report }}
          SUMMARY: ${{ steps.compare.outputs.summary }}
        run: |
          set -euo pipefail
          echo "::error::Contract size regression detected."
          echo "$SUMMARY"
          printf '%s\n' "$REPORT"
          exit 1

      # Only now — on main, and only if there was no regression — update the
      # committed baseline. The comparison above used the temp-file baseline.
      - name: Write updated baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIZES: ${{ steps.measure.outputs.sizes }}
        run: |
          python3 - <<'PY'
          import json, os
          sizes = json.loads(os.environ["SIZES"])
          with open(".wasm-sizes.json", "w", encoding="utf-8") as handle:
              json.dump(sizes, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(f"Updated .wasm-sizes.json with {len(sizes)} contract(s).")
          PY

      - name: Commit updated baseline and history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .wasm-sizes.json .wasm-size-history.json
          if git diff --cached --quiet; then
            echo "No baseline or history changes to commit."
          else
            git commit -m "chore: update WASM size baseline and history [skip ci]"
            git push
          fi
