name: Deploy to Futurenet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        required: true
        default: futurenet
        type: choice
        options: [futurenet, testnet]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.inputs.network || 'futurenet' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SOROBAN_NETWORK: ${{ github.event.inputs.network || 'futurenet' }}
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # ─── Build optimized WASM ────────────────────────────────────────────────
  build:
    name: Build Release WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      wasm-name: ${{ steps.find-wasm.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # Same `wasm` shared key as ci.yml's build job: on a merge to main the
      # dependency graph is already cached from the PR pipeline.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: wasm

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and optimize WASM
      - uses: ./.github/actions/setup-stellar-cli

      - name: Build WASM
        env:
          CARGO_INCREMENTAL: 0
        run: stellar contract build --locked || stellar contract build

      - name: Optimize WASM
        id: find-wasm
        run: |
          stellar contract build --optimize
          WASM=$(ls target/wasm32v1-none/release/*.wasm | grep -v deps | head -1)
          cp "$WASM" optimized.wasm
          echo "name=$(basename $WASM)" >> "$GITHUB_OUTPUT"
          echo "Optimized size: $(stat -c%s optimized.wasm) bytes"

      - name: Upload optimized WASM
        uses: actions/upload-artifact@v4
        with:
          name: optimized-wasm
          path: optimized.wasm
          retention-days: 30

  # ─── Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.network || 'futurenet' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.network || 'futurenet' }}
      url: https://stellar.expert/explorer/${{ github.event.inputs.network || 'futurenet' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-stellar-cli

      - name: Download optimized WASM
        uses: actions/download-artifact@v4
        with:
          name: optimized-wasm

      - name: Configure Soroban network
        run: |
          if [ "$SOROBAN_NETWORK" = "futurenet" ]; then
            stellar network add \
              --rpc-url https://rpc-futurenet.stellar.org \
              --network-passphrase "Test SDF Future Network ; October 2024" \
              futurenet
          else
            stellar network add \
              --rpc-url https://soroban-testnet.stellar.org \
              --network-passphrase "Test SDF Network ; September 2015" \
              testnet
          fi

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import deployer identity
        env:
          DEPLOYER_SECRET_KEY: ${{ secrets.DEPLOYER_SECRET_KEY }}
        run: |
          if [ -z "$DEPLOYER_SECRET_KEY" ]; then
            echo "DEPLOYER_SECRET_KEY is not configured; aborting deploy." >&2
            exit 1
          fi
          printf '%s' "$DEPLOYER_SECRET_KEY" | stellar keys add deployer --secret-key

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm optimized.wasm \
            --source deployer \
            --network "$SOROBAN_NETWORK")
          echo "contract-id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed contract: $CONTRACT_ID"

      - name: Smoke test — get_global_stats
        run: |
          RESULT=$(stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract-id }}" \
            --source deployer \
            --network "$SOROBAN_NETWORK" \
            -- get_global_stats)
          echo "get_global_stats result: $RESULT"
          [ -n "$RESULT" ] || (echo "❌ get_global_stats returned empty result" && exit 1)

      - name: Save deployment record
        run: |
          mkdir -p deployments
          echo '{
            "network": "${{ env.SOROBAN_NETWORK }}",
            "contractId": "${{ steps.deploy.outputs.contract-id }}",
            "deployedAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}"
          }' > deployments/${{ env.SOROBAN_NETWORK }}-latest.json
          cat deployments/${{ env.SOROBAN_NETWORK }}-latest.json

      - name: Upload deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ env.SOROBAN_NETWORK }}-${{ github.sha }}
          path: deployments/
          retention-days: 90

      - name: Post deployment summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const contractId = '${{ steps.deploy.outputs.contract-id }}';
            const network = '${{ env.SOROBAN_NETWORK }}';
            const commit = '${{ github.sha }}'.slice(0, 7);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: `## ${status} Deployment to ${network}\n\n**Contract ID:** \`${contractId}\`\n**Commit:** \`${commit}\`\n**Network:** ${network}\n**Actor:** ${{ github.actor }}`
            });
